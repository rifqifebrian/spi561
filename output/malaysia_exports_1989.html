const M = DATA.meta;
const css = getComputedStyle(document.documentElement);
const SLOT = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const sectorVar = {};
DATA.tree.forEach((s, i) => { sectorVar[s.n] = s.n === "Other" ? "--s0" : SLOT[i % 8]; });
const cv = n => `var(${sectorVar[n]})`;
const col = n => css.getPropertyValue(sectorVar[n]).trim();
DATA.tree.forEach(s => { s.v = d3.sum(s.k, h => h.v); });

const usd = v => v >= 1e9 ? "$" + (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" : "$" + (v / 1e3).toFixed(0) + "K";
const pct = v => { const p = v / M.total * 100; return (p >= 10 ? p.toFixed(1) : p >= 0.1 ? p.toFixed(2) : "<0.1") + "%"; };
const short = n => n.replace(/\s*\(excluding[^)]*\)/g, "");
function ink(hex) {
  const c = d3.rgb(hex), L = [c.r, c.g, c.b].map(x => { x /= 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; });
  const lum = .2126 * L[0] + .7152 * L[1] + .0722 * L[2];
  return (lum + .05) / .05 > 1.05 / (lum + .05) ? "#0b0b0b" : "#ffffff";
}

// Header
document.getElementById("eyebrow").textContent = `${M.iso} · ${M.year} · Exports to the world · HS ${M.classification === "H0" ? "1992" : M.classification}`;
const topSector = [...DATA.tree].sort((a, b) => b.v - a.v);
document.getElementById("lede").textContent =
  `${M.country} sold ${usd(M.total)} of goods abroad in ${M.year}. ${topSector[0].n} (${pct(topSector[0].v)}), ` +
  `${topSector[1].n.toLowerCase()} (${pct(topSector[1].v)}) and ${topSector[2].n.toLowerCase()} (${pct(topSector[2].v)}) ` +
  `were the largest sectors: a resource economy with a fast-growing electronics assembly base.`;
const allHS6 = DATA.tree.flatMap(s => s.k.flatMap(h => h.k.map(p => ({...p, s: s.n}))));
allHS6.sort((a, b) => b.v - a.v);
document.getElementById("figs").innerHTML = [
  [usd(M.total), "Total goods exports"],
  [M.nHS6.toLocaleString(), `HS6 products exported (${M.nHS4.toLocaleString()} HS4)`],
  [(M.top10 * 100).toFixed(1) + "%", "Share of the 10 largest HS6 products"],
  [Math.round(1 / M.hhi).toString(), "Effective number of products (1 / HHI)"],
].map(([b, s]) => `<div class="fig"><b>${b}</b><span>${s}</span></div>`).join("");

// Chips
let focus = null;
const chips = document.getElementById("chips");
function renderChips() {
  chips.innerHTML = `<button class="chip" id="chip-all" aria-pressed="${focus === null}">All sectors</button>` +
    DATA.tree.map((s, i) => `<button class="chip" id="chip-${i}" data-s="${s.n}" aria-pressed="${focus === s.n}"><i style="background:${cv(s.n)}"></i>${s.n} <em>${pct(s.v)}</em></button>`).join("");
  chips.querySelectorAll(".chip").forEach(b => b.onclick = () => setFocus(b.dataset.s || null));
}
function setFocus(s) { focus = s; renderChips(); draw(); }

// Treemap
const map = document.getElementById("map"), tip = document.getElementById("tip");
function draw() {
  const W = map.clientWidth, H = map.clientHeight;
  let root, sub;
  if (focus) {
    const s = DATA.tree.find(t => t.n === focus);
    root = d3.hierarchy({k: s.k.map(h => ({...h, s: s.n}))}, d => d.k).sum(d => d.k ? 0 : d.v);
    sub = s;
  } else {
    root = d3.hierarchy({k: DATA.tree.map(s => ({n: s.n, k: s.k.map(h => ({n: h.n, c: h.c, v: h.v, s: s.n, top: h.k}))}))}, d => d.k).sum(d => d.k ? 0 : d.v);
  }
  root.sort((a, b) => b.value - a.value);
  d3.treemap().size([W, H]).tile(d3.treemapSquarify.ratio(1.2)).paddingInner(2).paddingOuter(0).round(true)(root);
  document.getElementById("crumb").innerHTML = focus
    ? `<strong>${focus}</strong> · ${usd(sub.v)} · ${pct(sub.v)} of exports · HS6 products, grouped by HS4`
    : `<strong>All exports</strong> · ${usd(M.total)} · HS4 products, grouped by sector`;
  map.innerHTML = "";
  root.leaves().forEach(d => {
    const w = d.x1 - d.x0, h = d.y1 - d.y0, p = d.data, sector = p.s || d.parent.data.s;
    const fill = col(sector), el = document.createElement("div");
    el.className = "tile" + (w > 170 && h > 80 ? " big" : "");
    Object.assign(el.style, {left: d.x0 + "px", top: d.y0 + "px", width: w + "px", height: h + "px", background: fill, color: ink(fill)});
    el.tabIndex = w > 24 && h > 18 ? 0 : -1;
    el.setAttribute("aria-label", `${p.c} ${p.n}: ${usd(p.v)}, ${pct(p.v)}`);
    if (w > 54 && h > 30) {
      const lines = Math.max(1, Math.floor((h - 26) / 15));
      el.innerHTML = `<div class="t" style="-webkit-line-clamp:${lines}">${short(p.n)}</div><div class="p">${pct(p.v)}</div>`;
    }
    el.onmousemove = e => showTip(e.clientX, e.clientY, p, sector);
    el.onmouseleave = el.onblur = () => { tip.hidden = true; };
    el.onfocus = () => { const r = el.getBoundingClientRect(); showTip(r.left + 10, r.top + 10, p, sector); };
    el.onclick = () => { if (!focus) setFocus(sector); };
    el.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && !focus) { e.preventDefault(); setFocus(sector); } };
    map.appendChild(el);
  });
}
function showTip(x, y, p, sector) {
  const kids = (p.top || []).slice(0, 4);
  tip.innerHTML = `<div class="code">HS ${p.c} · ${sector}</div><div>${p.n}</div>` +
    `<div class="v">${usd(p.v)} <span style="color:var(--muted);font-weight:400">· ${pct(p.v)} of exports</span></div>` +
    (kids.length > 1 ? `<ul>${kids.map(k => `<li><span>${k.c} ${short(k.n).slice(0, 48)}${short(k.n).length > 48 ? "…" : ""}</span><span>${usd(k.v)}</span></li>`).join("")}</ul>` : "");
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, innerWidth - tw - 8) + "px";
  tip.style.top = (y + 14 + th > innerHeight ? y - th - 10 : y + 14) + "px";
}

// Sector bars
const maxS = topSector[0].v;
document.getElementById("bars").innerHTML = topSector.map(s =>
  `<div class="bar"><span>${s.n}</span><div class="track"><div class="fill" style="width:${s.v / maxS * 100}%;background:${cv(s.n)}"></div></div><span class="num">${pct(s.v)}</span></div>`).join("");

// Top products table
document.getElementById("top").innerHTML =
  `<thead><tr><th>HS6</th><th>Product</th><th class="n">Value</th><th class="n">Share</th></tr></thead><tbody>` +
  allHS6.slice(0, 20).map(p => `<tr><td class="code">${p.c}</td><td class="desc"><span class="sw" style="background:${cv(p.s)}"></span>${short(p.n)}</td><td class="n">${usd(p.v)}</td><td class="n">${pct(p.v)}</td></tr>`).join("") + "</tbody>";

document.getElementById("note").innerHTML =
  `<p><strong>Source.</strong> UN Comtrade, ${M.country} reported exports to the world, ${M.year}, HS ${M.classification === "H0" ? "1992 (H0)" : M.classification} at 6 digits, current US$ (file ${M.source}). Sectors group HS chapters roughly the way the Harvard Atlas of Economic Complexity does; wood and paper are kept as their own sector.</p>` +
  `<p><strong>What this does not show.</strong> Economic complexity measures (ECI, PCI, revealed comparative advantage and the product space) compare a country's basket with every other country's. They need world export data for ${M.year}, which this single-country file does not include.</p>`;

renderChips();
draw();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 120); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderChips(); draw(); });
new MutationObserver(() => { renderChips(); draw(); }).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
</script>
