const rangeEl = document.getElementById("range");
function renderRange() {
  rangeEl.innerHTML = RANGES.map((r, i) => `<button class="chip" id="range-${i}" aria-pressed="${r === range}">${r[0]}–${r[1]}</button>`).join("");
  rangeEl.querySelectorAll("button").forEach((b, i) => b.onclick = () => { range = RANGES[i]; renderRange(); drawAll(); });
}

const host = document.getElementById("charts");
const views = DATA.charts.map((c, ci) => {
  const el = document.createElement("section");
  el.className = "chart";
  const latest = c.series.map((s, i) => { const p = s.points[s.points.length - 1]; return p ? `${countries[i].name} ${fmts[c.fmt](p[1])} (${p[0]})` : null; }).filter(Boolean).join(" · ");
  el.innerHTML = `<h2>${c.title}<span>${c.unit}</span></h2><p class="sub">Latest: ${latest}</p>` +
    `<div class="plot" id="plot-${ci}" role="img" aria-label="${c.title}, ${c.unit}, line chart by country"></div>` +
    `<details><summary>Data table</summary><div class="tablewrap"><table id="table-${ci}"></table></div></details>`;
  host.appendChild(el);
  return {c, plot: el.querySelector(".plot"), table: el.querySelector("table")};
});

function draw(view) {
  const {c, plot, table} = view;
  const W = plot.clientWidth, H = plot.clientHeight, narrow = W < 560;
  const m = {t: 10, r: narrow ? 74 : 96, b: 26, l: narrow ? 46 : 58};
  const vis = c.series.map((s, i) => ({...s, i, pts: s.points.filter(p => p[0] >= range[0] && p[0] <= range[1])}));
  const vals = vis.flatMap(s => s.pts.map(p => p[1]));
  let lo = Math.min(0, d3.min(vals)), hi = d3.max(vals);
  const x = d3.scaleLinear().domain(range).range([m.l, W - m.r]);
  const y = d3.scaleLinear().domain([lo, hi]).nice(5).range([H - m.b, m.t]);
  const svg = d3.select(plot).html("").append("svg").attr("width", W).attr("height", H);
  svg.append("g").selectAll("line").data(y.ticks(5)).join("line").attr("class", d => d === 0 ? "zero" : "gl")
    .attr("x1", m.l).attr("x2", W - m.r).attr("y1", d => y(d)).attr("y2", d => y(d)).attr("stroke-width", d => d === 0 ? 1.2 : 1);
  svg.append("g").selectAll("text").data(y.ticks(5)).join("text").attr("x", m.l - 8).attr("y", d => y(d) + 4).attr("text-anchor", "end").text(ticks[c.fmt]);
  const span = range[1] - range[0], step = span > 40 ? 10 : span > 20 ? 5 : 2;
  const xt = d3.range(Math.ceil(range[0] / step) * step, range[1] + 1, step);
  svg.append("g").selectAll("text").data(xt).join("text").attr("x", d => x(d)).attr("y", H - 6).attr("text-anchor", "middle").text(d => d);
  const line = d3.line().defined(p => p != null).x(p => x(p[0])).y(p => y(p[1]));
  // Break lines at missing years instead of bridging them.
  const withGaps = pts => pts.flatMap((p, k) => k && p[0] - pts[k - 1][0] > 1 ? [null, p] : [p]);
  svg.append("g").selectAll("path").data(vis).join("path").attr("fill", "none").attr("stroke", s => countries[s.i].v)
    .attr("stroke-width", 2).attr("stroke-linejoin", "round").attr("stroke-linecap", "round").attr("d", s => line(withGaps(s.pts)));
  // End markers and direct labels, nudged apart so they never overlap.
  const ends = vis.filter(s => s.pts.length).map(s => { const p = s.pts[s.pts.length - 1]; return {s, p, ty: y(p[1])}; }).sort((a, b) => a.ty - b.ty);
  for (let k = 1; k < ends.length; k++) if (ends[k].ty - ends[k - 1].ty < 15) ends[k].ty = ends[k - 1].ty + 15;
  const over = ends.length ? ends[ends.length - 1].ty - (H - m.b) : 0;
  if (over > 0) ends.forEach(e => e.ty -= over);
  svg.append("g").selectAll("circle").data(ends).join("circle").attr("cx", e => x(e.p[0])).attr("cy", e => y(e.p[1])).attr("r", 4)
    .attr("fill", e => countries[e.s.i].v).attr("stroke", "var(--surface)").attr("stroke-width", 2);
  svg.append("g").selectAll("text").data(ends).join("text").attr("class", "lab").attr("x", e => x(e.p[0]) + 9).attr("y", e => e.ty + 4)
    .text(e => narrow ? e.s.code : e.s.name);
  // Hover layer: crosshair shared across all charts, tooltip on the hovered one.
  const cross = svg.append("line").attr("y1", m.t).attr("y2", H - m.b).attr("stroke", "var(--muted)").attr("stroke-dasharray", "3 3").attr("visibility", "hidden");
  const dots = svg.append("g");
  const tip = d3.select(plot).append("div").attr("class", "tip").attr("hidden", true);
  view.show = (yr, own) => {
    if (yr == null || yr < range[0] || yr > range[1]) { cross.attr("visibility", "hidden"); dots.html(""); tip.attr("hidden", true); return; }
    cross.attr("x1", x(yr)).attr("x2", x(yr)).attr("visibility", "visible");
    const hits = vis.map(s => ({s, p: s.pts.find(p => p[0] === yr)}));
    dots.selectAll("circle").data(hits.filter(h => h.p)).join("circle").attr("cx", h => x(yr)).attr("cy", h => y(h.p[1])).attr("r", 4)
      .attr("fill", h => countries[h.s.i].v).attr("stroke", "var(--surface)").attr("stroke-width", 2);
    if (!own) { tip.attr("hidden", true); return; }
    tip.attr("hidden", null).html(`<b>${yr}</b>` + hits.map(h => `<div><span><i style="background:${countries[h.s.i].v}"></i>${countries[h.s.i].name}</span><span>${h.p ? fmts[c.fmt](h.p[1]) : "no data"}</span></div>`).join(""));
    const tw = tip.node().offsetWidth, px = x(yr);
    tip.style("left", (px + 14 + tw > W - m.r ? px - tw - 14 : px + 14) + "px").style("top", m.t + 4 + "px");
  };
  svg.append("rect").attr("x", m.l).attr("y", 0).attr("width", W - m.l - m.r + 8).attr("height", H).attr("fill", "transparent")
    .on("pointermove", e => { const yr = Math.round(x.invert(d3.pointer(e)[0])); hoverYear = yr; views.forEach(v => v.show(yr, v === view)); })
    .on("pointerleave", () => { hoverYear = null; views.forEach(v => v.show(null)); });
  // Table view of the visible range.
  const years = d3.range(range[0], range[1] + 1).filter(yr => vis.some(s => s.pts.some(p => p[0] === yr)));
  table.innerHTML = `<thead><tr><th>Year</th>${vis.map(s => `<th>${s.name}</th>`).join("")}</tr></thead><tbody>` +
    years.map(yr => `<tr><td>${yr}</td>${vis.map(s => { const p = s.pts.find(p => p[0] === yr); return `<td>${p ? fmts[c.fmt](p[1]) : "–"}</td>`; }).join("")}</tr>`).join("") + "</tbody>";
}
function drawAll() { views.forEach(draw); }

document.getElementById("note").innerHTML =
  `<p><strong>Source.</strong> World Bank, World Development Indicators: ` + DATA.charts.map(c => `${c.indicator} (${c.code})`).join("; ") + `. Blank years are missing in the source and appear as gaps.</p>` +
  `<p>FDI is net inflows from the balance of payments, so a year can be negative when foreign investors withdraw more than they put in.</p>`;

renderRange();
drawAll();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawAll, 120); });
</script>
